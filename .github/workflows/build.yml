name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: hypforward

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  build:
    name: Build ${{ matrix.asset }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - asset: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
          - asset: macos-x86_64
            os: macos-14
            target: x86_64-apple-darwin
            archive: tar.gz
          - asset: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - asset: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - asset: windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux cross compiler
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cross
      - name: Build release binary
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cross build --locked --release --target "${{ matrix.target }}"
          else
            cargo build --locked --release --target "${{ matrix.target }}"
          fi
      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" dist/
          cp README.md LICENSE dist/
          tar -C dist -czf "${BINARY_NAME}-${{ matrix.asset }}.tar.gz" "${BINARY_NAME}" README.md LICENSE
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${env:BINARY_NAME}.exe" dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path "dist/${env:BINARY_NAME}.exe", dist/README.md, dist/LICENSE -DestinationPath "${env:BINARY_NAME}-${{ matrix.asset }}.zip"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hypforward-${{ matrix.asset }}
          path: hypforward-${{ matrix.asset }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hypforward-*
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: sha256sum hypforward-* > SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/hypforward-*.tar.gz
            release/hypforward-*.zip
            release/SHA256SUMS
